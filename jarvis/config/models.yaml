# Models & roles (Spec §33 model router). PRE-CONFIGURED for Google Gemini —
# just put your key in .env:  JARVIS_GEMINI_API_KEY=...
#
# roles: fast | default | reasoning | vision | coding | local
ai:
  models:
    - id: gemini-2.0-flash
      provider: gemini
      api_key_env: JARVIS_GEMINI_API_KEY
      roles: [fast, default, vision]
    - id: gemini-1.5-pro
      provider: gemini
      api_key_env: JARVIS_GEMINI_API_KEY
      roles: [reasoning, coding]
  roles:
    fast: gemini-2.0-flash
    default: gemini-2.0-flash
    vision: gemini-2.0-flash
    reasoning: gemini-1.5-pro
    coding: gemini-1.5-pro
  default_role: default
