name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: jarvis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy ruff

      - name: Lint (ruff — bug-level rules)
        run: ruff check app tests scripts run.py --select E9,F

      - name: Run tests (browser tests excluded — need Playwright/Chromium)
        run: pytest -m "not browser"

  browser:
    name: Browser agent tests
    runs-on: ubuntu-latest
    # Non-blocking until verified on GitHub runners (needs Chromium download).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis/requirements.txt

      - name: Install dependencies
        working-directory: jarvis
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy playwright
          playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: jarvis
        run: pytest -m browser
